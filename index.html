  </main>

  <nav class="bottom" id="bottomNav"></nav>

</div>

<script>
/* Rescate de arranque V10.1.10: sin credenciales ni escritura de datos. */
(function () {
  function mostrarErrorDeArranque(forzar) {
    const main = document.getElementById('mainArea');
    if (!main || (!forzar && !main.querySelector('.loading'))) return false;
    const nav = document.getElementById('bottomNav');
    if (nav) nav.textContent = '';
    main.innerHTML = '<section class="loginShell"><div class="loginCard" style="max-width:460px;margin:24px auto;text-align:center">' +
      '<h2>La conexión está tardando demasiado</h2>' +
      '<p>Natura Vida no pudo terminar de cargar los datos desde Supabase. El servidor puede estar recuperándose o la conexión puede estar interrumpida.</p>' +
      '<p><strong>No se mostrarán cifras de ventas ni inventario sin confirmar la sincronización.</strong> La sesión no se cerrará ni se borrarán registros.</p>' +
      '<button class="btn block" id="nvRetryStartupV1019" type="button">Reintentar carga</button>' +
      '<small style="display:block;margin-top:12px">Si continúa el error, avisa al administrador. No borres los datos de la aplicación.</small></div></section>';
    document.getElementById('nvRetryStartupV1019').addEventListener('click', function () {
      const u = new URL(window.location.href);
      u.searchParams.set('nv-reintento', String(Date.now()));
      window.location.replace(u.toString());
    });
    return true;
  }
  window.nvShowStartupProblemV1019 = mostrarErrorDeArranque;
  window.setTimeout(function () { mostrarErrorDeArranque(false); }, 16000);
})();
</script>

<script>

    document.getElementById('dateStamp').textContent = d.toLocaleDateString('es-BO', { day: '2-digit', month: '2-digit', year: 'numeric' });

</script>
